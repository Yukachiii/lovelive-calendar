<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#eef9ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ラブカレ" />
  <title>ラブカレ MVP</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1>ラブカレ <span style="font-size:.62em;color:#6f91a6">MVP</span></h1>
        <p>ラブライブ！関連イベントを、行く・迷う・行かないでサクッと管理。</p>
      </div>
      <div class="pill">公式情報確認済み / 2026年9–10月</div>
    </header>

    <section class="toolbar">
      <div class="toolbar-top">
        <div class="month-nav">
          <button id="prevMonth" aria-label="前月">←</button>
          <div id="monthLabel"></div>
          <button id="nextMonth" aria-label="翌月">→</button>
        </div>
        <div class="summary" id="summary"></div>
      </div>

      <div class="filter-panel" aria-label="イベントの絞り込み">
        <div class="filter-head">
          <div>
            <span class="filter-title">絞り込み</span>
            <span class="filter-count" id="filterCount">条件なし</span>
          </div>
          <button class="filter-reset" id="resetFilters" type="button">条件をクリア</button>
        </div>

        <div class="filter-fields">
          <label class="filter-field filter-field-search">
            <span>キーワード</span>
            <input id="queryFilter" type="search" placeholder="イベント名・出演者・会場" autocomplete="off" />
          </label>
          <label class="filter-field">
            <span>関連シリーズ</span>
            <select id="seriesFilter"><option value="all">すべて</option></select>
          </label>
          <label class="filter-field">
            <span>出演者</span>
            <select id="castFilter"><option value="all">すべて</option></select>
          </label>
          <label class="filter-field">
            <span>地域</span>
            <select id="regionFilter"><option value="all">すべて</option></select>
          </label>
          <label class="filter-field">
            <span>参加ステータス</span>
            <select id="statusFilter"><option value="all">すべて</option></select>
          </label>
        </div>

        <fieldset class="category-filters">
          <legend>イベント種別</legend>
          <div class="filters" id="categoryFilters"></div>
        </fieldset>
      </div>
    </section>

    <main class="layout">
      <section class="calendar">
        <div class="weekdays">
          <div class="weekday">日</div>
          <div class="weekday">月</div>
          <div class="weekday">火</div>
          <div class="weekday">水</div>
          <div class="weekday">木</div>
          <div class="weekday">金</div>
          <div class="weekday">土</div>
        </div>
        <div class="grid" id="calendarGrid"></div>
      </section>

      <aside class="sidebar">
        <h2>今月のイベント</h2>
        <div class="hint">ステータスは自動でブラウザに保存されます。</div>
        <div class="event-list" id="eventList"></div>
        <div class="footer-note">
          ※ 9月分は2026年9月10日、10月分は9月9日時点で、掲載対象のイベント情報を確認しています。月内の全イベントを網羅するものではありません。参加・応募前に各イベントの公式ページで最新情報を確認してください。
        </div>
      </aside>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div>
          <div id="modalCategory"></div>
          <h2 id="modalTitle"></h2>
        </div>
        <button class="close" id="modalClose" aria-label="閉じる">×</button>
      </div>
      <dl>
        <dt>日時</dt><dd id="modalDate"></dd>
        <dt>関連シリーズ</dt><dd id="modalSeries"></dd>
        <dt>出演</dt><dd id="modalCast"></dd>
        <dt>会場</dt><dd id="modalVenue"></dd>
        <dt>情報源</dt><dd id="modalSources"></dd>
        <dt>確認日</dt><dd id="modalVerifiedAt"></dd>
        <dt>メモ</dt><dd id="modalNote"></dd>
      </dl>
      <div class="status-row" id="modalStatus"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
