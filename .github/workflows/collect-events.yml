name: Collect event updates

on:
  workflow_dispatch:
  schedule:
    # UTC。日本時間では、おおむね 03:17 / 09:17 / 15:17 / 21:17 に実行されます。
    - cron: "17 0,6,12,18 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: collect-event-updates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore collector state
        uses: actions/cache/restore@v6
        with:
          path: .automation-cache
          key: event-source-state-${{ github.run_id }}
          restore-keys: |
            event-source-state-

      - name: Collect event candidates and changes
        id: collect
        run: node scripts/collect-events.mjs

      - name: Upload collection report
        uses: actions/upload-artifact@v7
        with:
          name: event-collection-report-${{ github.run_id }}
          path: automation-output/
          retention-days: 14

      - name: Update the review issue
        if: steps.collect.outputs.has_alerts == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label="automation:event-monitor"
          title="[自動収集] 要確認イベント情報"

          gh label create "$label" \
            --color "1D76DB" \
            --description "イベント自動収集の確認対象" \
            --force

          printf '\n---\n[この実行の詳細](%s/%s/actions/runs/%s)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            >> automation-output/report.md

          issue_number="$(gh issue list \
            --state open \
            --label "$label" \
            --limit 1 \
            --json number \
            --jq '.[0].number')"

          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" \
              --title "$title" \
              --body-file automation-output/report.md
          else
            gh issue create \
              --title "$title" \
              --label "$label" \
              --body-file automation-output/report.md
          fi

      - name: Save collector state
        uses: actions/cache/save@v6
        with:
          path: .automation-cache
          key: event-source-state-${{ github.run_id }}
